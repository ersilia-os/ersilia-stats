# Lint configuration, pinned so that "clean" means the same thing to everyone.
#
# WHY THIS FILE EXISTS. There was no config, so `ruff check scripts/` used ruff's small
# default set (E4, E7, E9, F) while `ruff check --select ALL` reported hundreds of findings.
# Neither was "the" answer, and the practical consequence was worse than the ambiguity: a
# `# noqa: BLE001` comment explaining *why* a broad `except Exception` is deliberate looked
# like an unused directive, and `--fix` deleted the explanation. Pinning the rule set makes
# the suppressions meaningful again and makes a clean run reproducible.
line-length = 100

[lint]
select = [
    "F",     # pyflakes: undefined names, unused imports and locals
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "ARG",   # unused function arguments — two dead parameters were found this way
    "B",     # bugbear: real bug shapes. B007 caught a fixture tuple being mis-unpacked
    "BLE",   # blind except. Deliberate here in places, and those places say so
    "C4",    # comprehension clarity
    "PIE",   # redundant code
    "RET",   # unnecessary assignment before return
    "SIM",   # simplifications
    "RUF",   # ruff's own rules
]

ignore = [
    # EN DASH and other "ambiguous" characters are used on purpose, in prose and in axis
    # labels — "1–3 months" is typographically correct and appears on the rendered site.
    "RUF001", "RUF002", "RUF003",
    # `zip(strict=...)` is a real safety net and is applied where lengths must match; it is
    # not enforced everywhere, because several call sites zip a metric's labels against a
    # deliberately shorter top-N slice.
    "B905",
]

[lint.per-file-ignores]
# The collectors and the export CLI insert the scripts directory on sys.path before
# importing from it, so their imports cannot all sit at the top of the file.
"scripts/export_site_data.py" = ["E402"]
"scripts/resolve_dois.py" = ["E402"]
