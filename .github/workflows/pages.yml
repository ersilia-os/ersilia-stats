name: Deploy site

# Fetches every data source into the runner, builds site/data from it, and deploys
# site/ to GitHub Pages. Nothing fetched is committed (see .gitignore): the data lives
# only in the runner for the length of this job.
#
# Repository secrets:
#   AIRTABLE_API_KEY    read-only Airtable personal access token (required)
#   GH_STATS_TOKEN      GitHub token with read access to ersilia-os metadata (required).
#                       The traffic collector also needs "Administration: Read-only"
#                       (fine-grained) or the `repo` scope (classic).
#   DOCKERHUB_USERNAME  optional; with DOCKERHUB_TOKEN, lifts Docker Hub's anonymous
#   DOCKERHUB_TOKEN     pagination cap
#
# WHAT CAN STOP A DEPLOY, AND WHAT CANNOT. Only two fetches are required: Airtable, and
# the GitHub inventory that the public/private check below reads. Every other collector
# is `continue-on-error`: if one fails, the run shows a warning, its cards render their
# empty state, and the rest of the site still refreshes — the next weekly run fills them
# back in. Likewise an EMPTY chart is a warning here, not a failure, because it means an
# upstream source changed, not that the code is broken. What still fails the build is a
# code error (a chart pointing at a metric that does not exist, JavaScript that does not
# parse or render) or a disclosure guard; the previous deployment then stays live.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — refresh the published figures weekly.
    - cron: "0 6 * * 1"
  push:
    # Note: the weekly `schedule` above only ever fires from the default branch,
    # so main must stay the default branch for the automatic refresh to run.
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt is the pin, and CI must actually use it. It previously ran
      # `pip install pandas pyairtable==3.0.1` — pandas unpinned — so the runner and
      # the developer's machine could disagree on pandas behaviour. They did, and it
      # broke the first two builds.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Read-only. Fails the job on a partial fetch rather than quietly publishing
      # a site that under-reports.
      - name: Fetch Airtable snapshots into the runner
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python scripts/fetch_airtable.py \
            -t data/airtable_api_identifiers.csv \
            -o data/air_tables/

      # The public collectors. Order matters twice: fetch_docker_tags.py reads the image
      # list fetch_dockerhub.py writes, and fetch_openalex.py reads the DOIs from the
      # Airtable snapshot fetched above.
      - name: Fetch GitHub inventory
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/fetch_github.py -o data/github/

      - name: Fetch GitHub releases
        continue-on-error: true
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/fetch_github_releases.py -o data/github/

      - name: Fetch model packages
        continue-on-error: true
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/fetch_model_packages.py -o data/github/

      # GitHub keeps only a rolling 14-day traffic window, so fetch_github_traffic.py
      # unions today's fetch with the previous snapshot to build a history. That snapshot
      # is carried between runs in the Actions cache, and saved straight after the fetch
      # so a later failure in this job cannot lose it. A cache unused for 7 days is
      # evicted, which loses the history: keep the weekly schedule running. The fetch
      # needs a token with traffic access; without one it fails as a warning only.
      - name: Restore GitHub traffic history
        uses: actions/cache/restore@v4
        with:
          path: data/github/traffic_sources_*.csv
          key: github-traffic-${{ github.run_id }}
          restore-keys: github-traffic-

      - name: Fetch GitHub traffic
        id: traffic
        continue-on-error: true
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/fetch_github_traffic.py -o data/github/

      - name: Save GitHub traffic history
        if: steps.traffic.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/github/traffic_sources_*.csv
          key: github-traffic-${{ github.run_id }}

      - name: Fetch Docker Hub images and tags
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python scripts/fetch_dockerhub.py   -o data/dockerhub/
          python scripts/fetch_docker_tags.py -o data/dockerhub/

      - name: Fetch OpenAlex citations
        continue-on-error: true
        run: python scripts/fetch_openalex.py -o data/scholar/ --data-dir data/air_tables

      - name: Fetch PyPI packages and downloads
        continue-on-error: true
        run: python scripts/fetch_pypi.py -o data/pypi/

      # THE SITE DECIDES WHICH REPOSITORY NAMES IT MAY PUBLISH by reading Airtable's
      # `Visibility` column, and nothing used to check that column against GitHub. A
      # repository marked Public in Airtable and private on GitHub would have its name
      # published, and no test could have noticed — from the site's point of view nothing
      # would be wrong. So this gate runs before the build, not after it.
      #
      # Public data only, and no GitHub token: it compares the Airtable snapshot fetched
      # above against the public inventory fetched into data/github/. That is deliberate.
      # Logs on a public repository are world-readable, so CI must never enumerate private
      # repositories; `--include-private` exists for local runs and is not used here.
      #
      # Models whose Airtable status is `In progress` are exempt from needing a public
      # repository, which is what keeps this free of false alarms — the only two models
      # without one are both `In progress`.
      - name: GitHub and Airtable agree about what is public
        run: PYTHONPATH=scripts python scripts/check_github_airtable_sync.py

      # Nothing here used to look at the JavaScript at all: no parse, no run. A single
      # stray character in config.js deployed a page stuck on "Loading figures…" and
      # the workflow reported success.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the JavaScript parses
        run: |
          for f in site/config.js site/js/*.js; do
            node --check "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done

      - name: Build site data
        run: python scripts/export_site_data.py --data-dir data/air_tables --out site/data/stats.json

      # Fails the build if any chart in config.js points at a metric the exporter no
      # longer produces — a code error. Without this, a renamed metric silently drops a
      # card. EMPTY metrics are listed in the log but do not fail the deploy: that is an
      # upstream data gap (see the header), and check.yml's --fail-on-empty against the
      # fixture is what proves every chart CAN be drawn.
      - name: Check every chart resolves
        run: python scripts/check_config_paths.py

      # Per-file content hashes on every asset URL. GitHub Pages sends max-age=600 for
      # scripts and stylesheets alike, so without this a returning visitor can hold an
      # old styles.css while fetching a new cards.js — and a fix that spans both files
      # then appears not to have worked, because half of it is missing.
      - name: Stamp asset URLs with content hashes
        run: python scripts/stamp_assets.py --site site

      # Renders every route in headless Chrome and fails the build if a view shows no
      # cards, logs a console error, has a row whose spans do not sum to 12, or has a
      # caption that does not fit. This is the check that catches broken JavaScript,
      # which no amount of Python validation can see.
      - name: Smoke-test the rendered site
        run: node scripts/verify_site.mjs --site site

      # Belt and braces on top of the export's own guards: whatever else happens,
      # the artifact that goes public must contain no raw snapshot and no address.
      - name: Verify the artifact is aggregate-only
        run: |
          if find site -path '*air_tables*' | grep -q .; then
            echo "::error::A raw snapshot ended up under site/ — refusing to publish."
            exit 1
          fi
          if grep -rlEI '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' site/; then
            echo "::error::An email-like string reached site/ — refusing to publish."
            exit 1
          fi
          echo "Artifact is aggregate-only: no snapshots, no addresses."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
